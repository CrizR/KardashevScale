name: Probe Pixabay audio

on:
  push:
    branches:
      - agent/fix-entry-video-deadlock

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect official Pixabay page
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36' \
            'https://pixabay.com/music/ambient-futuristic-ambience-nowhere-175592/' \
            -o page.html

          python - <<'PY'
          import html
          import re
          from pathlib import Path

          raw = Path('page.html').read_text(encoding='utf-8', errors='ignore')
          normalized = html.unescape(raw.replace(r'\/', '/'))
          candidates = sorted({
              match.rstrip('\\')
              for match in re.findall(r'https?://[^\"\'\s<>]+', normalized)
              if '.mp3' in match.lower() or 'cdn.pixabay.com/download/audio/' in match.lower()
          })

          lines = [
              '## Pixabay soundtrack probe',
              '',
              f'Found **{len(candidates)}** direct audio candidate(s).',
              '',
          ]
          lines.extend(f'- `{candidate}`' for candidate in candidates[:30])
          if not candidates:
              lines.append('- No direct MP3 URL was exposed in the server-rendered page.')

          Path('probe-results.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          gh pr comment 17 --repo CrizR/KardashevScale --body-file probe-results.md
